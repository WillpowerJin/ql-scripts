# 宜家 (IKEA) 每日自动签到配置示例
# 复制为 config.yaml 后填入实际配置即可

# 账号列表（支持单账号或多账号）
accounts:
  - name: "主号"
    # IKEA CIAM Token (格式通常为 eyJ... 开头的 JWT 字符串)
    # 也可以直接运行 python3 ikea/pull_token.py --write-config 从手机一键提取写入
    token: "your_ikea_token_here"
    # party_uid: 可选，脚本会自动从 JWT Token 中提取；若 Token 经过特殊变形也可手动填入
    # party_uid: "CIAMe05b-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  # - name: "小号"
  #   token: "second_ikea_token_here"

# 定时与执行参数
run_at: "08:35"         # 常驻模式 (--loop) 下每天执行时间 (HH:MM)
random_delay: 0         # 触发后随机延迟秒数上限 (0 为关闭)，用于错峰
retry_times: 3          # 遇到异常时的重试次数
retry_delay: 15         # 重试基础间隔秒数
timeout: 20             # 请求超时时间 (秒)
inter_account_delay: 3  # 多账号之间的执行间隔 (秒)

# 通知配置（可选，与仓库中其它脚本共享）
bark:
  url: ""               # 完整 Bark URL，例如 https://api.day.app/your_key
  key: ""               # 或仅填 Bark 设备 Key
  server: "https://api.day.app"
  group: "宜家签到"
  sound: ""             # 提示音
  icon: ""              # 自定义通知图标 URL
  level: ""             # active / timeSensitive

pushplus:
  token: ""             # PushPlus 微信推送 Token
  topic: ""             # 群组编码（可选）
