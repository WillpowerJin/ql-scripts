# 宜家 (IKEA) App / 小程序凭证抓取 · Quantumult X 配置
#
# 使用步骤：
# 1) 把 ikea_cookie.js 放进 QX 的 Scripts 目录（或用远程链接）
# 2) 在 QX 配置文件中添加如下 [rewrite_local] 与 [mitm]
# 3) 打开宜家家居 App 或微信小程序，进入「积分商城」或「签到赚积分」
# 4) 手机将自动收到「宜家 Token 抓取成功」系统通知

[rewrite_local]
^https?:\/\/bff\.app\.ikea\.cn\/customer-bff\/(v3\.0\/activity|point\/benefit) url script-request-header ikea_cookie.js

[mitm]
hostname = bff.app.ikea.cn
