# 本地调试用配置（青龙请用环境变量）
# cp config.example.yaml config.yaml
# 勿把 config.yaml 提交到 Git

accounts:
  - name: "主号"
    phone: "13800138000"
    password: "your_password"
    # 可选：直接用抓包 token（免登）
    # z_token: "xxxxxxxx"
    # cookie: "acw_tc=..."

  # - name: "备号"
  #   phone: "139..."
  #   password: "..."

free_times: 3
# 0 = 按 /check 自适应抽到今日用完；>0 为安全上限
ad_times: 0
# 每轮抽奖随机间隔（秒）；若设 ad_interval>0 则固定间隔
ad_interval_min: 5
ad_interval_max: 8
# ad_interval: 0
timeout: 20
inter_account_delay: 5
# dry_run: false

# 通知（也可用环境变量 BARK_URL / BARK_KEY，与其它项目共用）
# notify:
