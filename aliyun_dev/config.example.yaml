# 本地调试（青龙请用环境变量，见 README）
# cp config.example.yaml config.yaml  # 勿提交 config.yaml

accounts:
  # 方式 1：用户名/邮箱 + 密码
  - name: "主号"
    username: "your_name_or_email@example.com"
    password: "your_password"

  # 方式 2：手机号 + 密码
  # - name: "手机号"
  #   phone: "13800138000"
  #   password: "your_password"

  # 方式 3：Cookie（密码触发滑块时推荐）
  # - name: "Cookie号"
  #   cookie: "login_aliyunid_ticket=...; cna=...; ..."

# 上下午任务分界（小时，1-23）；也可环境变量 ALIYUN_TIME / aliyunWeb_time
split_hour: 12

# 轻量场景/视频默认开（多一点积分来源）；不需要可改 false 或环境变量 ALIYUN_SCENE=0
enable_scene: true
enable_video: true
enable_stock: false

timeout: 30
max_retries: 3
retry_interval: 8
inter_account_delay: 3

notify:
  bark_url: ""
  bark_key: ""
  bark_server: "https://api.day.app"
  bark_group: "阿里云社区"
  serverchan_key: ""
  webhook_url: ""
