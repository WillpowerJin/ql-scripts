# 京东签到配置（复制为 config.yaml 后填写；也可用环境变量 JD_COOKIE 替代 cookies 段）

# 京东 Cookie（必填）。pt_key 有效期约 30 天，失效需重新获取。
# 多账号写多行。获取方法见 README.md。
cookies:
  - "pt_key=AAJxxxxxxxx;pt_pin=jd_xxxxxx;"
  # - "pt_key=AAJyyyyyyyy;pt_pin=jd_yyyyyy;"

# 设备身份（一般不用改）
# user_agent 留空则按账号自动生成固定的 jdapp iPhone UA（跨天保持一致，降低风控）
user_agent: ""
client: "apple"           # 京东 iOS App 标识
client_version: "12.6.3"  # 京东 App 版本号

# 可选：京东 App 抓包拿到的 x-api-eid-token（设备 token）。
# 没有就留空：hs/ys/delivery/game 不依赖它；京喜系任务理论上 App 会带，
# 留空时被拒再考虑抓包补填。
eid_token: ""

# 任务开关（true 启用 / false 停用）
tasks:
  hs: true        # hs 健康签到（无签名接口，最稳，约 1 京豆/天）
  ys: true        # ys 健康签到（同上）
  delivery: true  # 天天领豆（h5st 签名，活动 2775/5358）
  game: true      # 互动游戏签到（h5st 签名）
  jxzy: true      # 京喜签到（claim 需 h5st）
  home: true      # 家电家居签到（同京喜流程）
  index: true     # 京东指数签到（同京喜流程）

# 任务间随机等待秒数 [最小, 最大]
gap_seconds: [5, 15]

# 通知配置（可选，与 huazhu / kuailefeng 等项目兼容；对应环境变量优先）
bark:
  url: ""               # 完整 Bark URL，例如 https://api.day.app/your_key（对应 BARK_URL / BARK_PUSH）
  key: ""               # 或仅填 Bark 设备 Key（对应 BARK_KEY / BARK_DEVICE_KEY）
  server: "https://api.day.app"   # 自建服务器时修改（对应 BARK_SERVER）
  group: "京东签到"      # 通知分组（对应 BARK_GROUP）
  sound: ""             # 提示音，例如 minuet（对应 BARK_SOUND）
  icon: ""              # 自定义通知图标 URL（对应 BARK_ICON）
  level: ""             # 通知中断级别，例如 active / timeSensitive（对应 BARK_LEVEL）

pushplus:
  token: ""             # PushPlus 微信推送 Token（对应 PUSHPLUS_TOKEN）
  topic: ""             # 群组编码（对应 PUSHPLUS_TOPIC）
