# 习酒 access_token · QX v4
#
# ★ 你之前看到的通知若是这种格式，说明还在跑【旧脚本】：
#     账号：iPhone
#     时间：...
#     token：sK_mis9…r7OLkA   ← 中间省略，不是完整值
#   新脚本标题必须是：习酒TK·iPhone·v4
#   正文是一整行 86 个字符，没有「账号/时间/token：」这些行
#
# ★ 远程脚本容易被 QX 缓存，推荐「本地脚本」或 URL 带 ?v=4
#
# ---------- 方案 A：远程（带防缓存参数）----------
[rewrite_local]
^https?:\/\/fm\.exijiu\.com\/api\/customer\/daily\/checkTodaySignIn url script-request-header https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token.js?v=4

[mitm]
hostname = fm.exijiu.com

# ---------- 方案 B：本地脚本（最稳，推荐）----------
# 1) 把 xijiu_access_token.js 全文复制到 QX「工具 → 脚本编辑器」保存为
#    xijiu_access_token.js（或 iCloud 路径）
# 2) rewrite 改成：
# ^https?:\/\/fm\.exijiu\.com\/api\/customer\/daily\/checkTodaySignIn url script-request-header xijiu_access_token.js
#
# 删除所有旧的 fm.exijiu.com 宽规则后，重载配置再试。
