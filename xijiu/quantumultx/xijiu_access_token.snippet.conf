# 习酒 · 君品荟 —— Quantumult X 配置片段（抓 access_token）
#
# 【为什么会连弹很多条一样的通知？】
#   签到页会对 fm.exijiu.com 同时发很多请求，旧规则匹配「整站」时脚本会连跑多次。
#   现已：1) 建议只匹配签到 API 路径  2) 脚本内 2 分钟防抖，同一 token 只通知一次
#
# 【怎么复制 token】
#   通知长按正文拷贝 / 日志搜 [xijiu] / 运行 show 脚本
#
# raw：
#   https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token.js
#   https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token_show.js

[rewrite_local]
# 推荐：只匹配积分签到相关接口（大幅减少触发次数）
^https?:\/\/fm\.exijiu\.com\/api\/customer\/daily\/ url script-request-header https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token.js

# 若上面抓不到，再改用整站（仍有脚本防抖，但触发更多）：
# ^https?:\/\/fm\.exijiu\.com\/ url script-request-header https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token.js

[mitm]
# 追加到你现有的 hostname 后面，不要整行覆盖
hostname = fm.exijiu.com
