# 习酒 · 君品荟 —— QuantumultX 配置片段
#
# 把这个片段整段追加到你 QuantumultX 的 config.conf 对应小节，
# 或在「重写」里点「+」→「导入分流规则」贴入。
#
# 你需要做的替换：
#   1) [rewrite_local] 里最后一行的 URL（本仓库默认 raw）：
#      https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token.js
#      也可改用 jsdelivr / 本地脚本路径。
#
#   2) [mitm] 里的 hostname 追加 fm.exijiu.com（下方已给出示例）。
#      如果你已有 hostname 一行，别覆盖，只把 fm.exijiu.com 加进去，逗号分隔。
#      追加完成后到 QuantumultX 首页「MitM」重新生成/信任证书。
#
# 抓包目标：微信小程序「习酒君品荟 → 签到」页请求头 X-access-token
# 匹配范围保守：只处理带此头的接口，其他请求原样透传。

[rewrite_local]
# 命中习酒积分域名的所有请求，交给脚本判断
^https?:\/\/fm\.exijiu\.com\/ url script-request-header https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/xijiu/quantumultx/xijiu_access_token.js

[mitm]
# 追加到你现有的 hostname 后面：
hostname = fm.exijiu.com
