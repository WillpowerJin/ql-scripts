# 习酒 · 君品荟（酒谷）
# cp config.example.yaml config.yaml 后填写（config.yaml 勿提交）

accounts:
  # login_code：抓包 xcx.exijiu.com 请求头（酒谷 JWT 换票必填）
  - name: "主号"
    login_code: "在此填写 login_code"

  # - name: "iPhone"
  #   login_code: ""

# 习酒文旅 → 酒谷活动
do_garden: true
# 酒兑积分（默认关，避免误兑）
exchange_wine: false

# 滑块 OCR（酒谷每日验证）
# 远程：POST {ocr_server}/capcode
# ocr_server: "http://ip:7777"
# 也可本机安装 ddddocr 走本地识别（青龙 Alpine 不建议）

timeout: 25
# user_agent: "..."

garden:
  # 单块地浇水/施肥最大次数（防止死循环）
  max_action: 30
  yeast_volumn: 100
  wine_volumn: 200

notify:
  bark_url: ""
  bark_key: ""
  bark_group: "习酒君品荟"
  # webhook_url: ""
