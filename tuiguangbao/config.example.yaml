accounts:
  - name: "主号"
    phone: "13800138000"
    password: "your_password"
    # 可选：已有 Discuz 会话时直接填 cookie（含 *_auth）
    # cookie: "xxx_auth=...; xxx_sid=..."

  # - name: "备号"
  #   phone: "139..."
  #   password: "..."

invite_code: "000GHFAV"
timeout: 15
max_retries: 3
retry_interval: 10
ad_watch_seconds: 22
inter_account_delay: 6
inter_ad_delay_min: 3
inter_ad_delay_max: 6
max_ad_loops: 50
# dry_run: false

notify:
  # Bark：二选一
  bark_url: ""
  bark_key: ""
  bark_server: "https://api.day.app"
  bark_group: "推广宝"
  # bark_sound: "bell"
  # bark_icon: "https://example.com/icon.png"
  # bark_level: "active"

  # 可选其它渠道
  serverchan_key: ""
  webhook_url: ""
