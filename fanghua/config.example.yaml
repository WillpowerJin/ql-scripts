# 复制为 config.yaml 后填写（不要提交 config.yaml）
# cp config.example.yaml config.yaml

accounts:
  # 方式一（推荐）：直接填已有的 AppToken，定时任务不会再登录
  - name: "主号"
    token: ""
    # device_id / jpush_id 可不填：
    #   脚本会按手机号生成「稳定且账号互不相同」的 ID，并写入 token_cache.json
    #   同账号下次运行复用同一设备，多账号不会串设备
    # device_id: ""
    # jpush_id: ""

  # 方式二：手机号 + 密码（注意：服务端目前已关闭密码登录，会返回
  #   「暂不支持密码登录111」；保留仅为服务端恢复后兼容）
  # - name: "主号"
  #   phone: "13800138000"
  #   password: "你的密码"

  # 方式三：手机号 + 短信验证码（验证码一次性，几分钟内有效）
  #   首次可用 `python3 main.py --sms-login` 自动发码并输入
  # - name: "号2"
  #   phone: "13900139000"
  #   sms_code: "123456"

# 单账号最长挂机小时（默认 2）
max_run_hours: 2
timeout: 15

notify:
  # Bark 二选一
  bark_url: ""
  bark_key: ""
  bark_server: "https://api.day.app"
