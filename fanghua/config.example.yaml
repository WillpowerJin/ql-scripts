# 复制为 config.yaml 后填写（不要提交 config.yaml）
# cp config.example.yaml config.yaml

accounts:
  # 方式一：手机号 + 密码（推荐，脚本会自动登录拿 AppToken）
  - name: "主号"
    phone: "13800138000"
    password: "你的密码"
    # device_id / jpush_id 可不填：
    #   脚本会按手机号生成「稳定且账号互不相同」的 ID，并写入 token_cache.json
    #   同账号下次运行复用同一设备，多账号不会串设备
    # device_id: ""
    # jpush_id: ""

  - name: "号2"
    phone: "13900139000"
    password: "密码2"

  # 方式二：直接填抓包/缓存的 AppToken
  # - name: "备号"
  #   token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9...."

# 单账号最长挂机小时（默认 2）
max_run_hours: 2
timeout: 15

notify:
  # Bark 二选一
  bark_url: ""
  bark_key: ""
  bark_server: "https://api.day.app"
