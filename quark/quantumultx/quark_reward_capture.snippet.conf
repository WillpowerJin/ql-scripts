# 夸克 growth/reward 抓 kps/sign/vcode · QX v3
#
# 只抓 https://drive-m.quark.cn/1/clouddrive/act/growth/reward 一个接口
# 通知内容（分行 + emoji）：
#   🔑 kps=...
#   ✍️ sign=...
#   🔢 vcode=...
# 同 URL 60 秒冷却，避免刷屏。

[rewrite_local]
^https?:\/\/drive-m\.quark\.cn\/1\/clouddrive\/act\/growth\/reward url script-request-header quark_reward_capture.js

[mitm]
hostname = drive-m.quark.cn

# 使用步骤：
# 1) 把 quark_reward_capture.js 放到 QX 的 Scripts 目录
#    （文件 App → iCloud 云盘 / 我的 iPhone → Quantumult X → Scripts）
# 2) QX → 重写：贴上面的 rewrite_local + mitm，然后右下角刷新
# 3) 夸克 App 点会员中心 / 触发一次 growth/reward
# 4) 收到「🚀 夸克签名·v3」通知即抓成功
#
# 值也会同步缓存到 $prefs：
#   quark_kps / quark_sign / quark_vcode / quark_reward_ts
