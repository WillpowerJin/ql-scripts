# 本地运行用配置（青龙请用环境变量，见 README）
# cp config.example.yaml config.yaml
# 不要把 config.yaml 提交到 Git

accounts:
  - name: "主号"                 # 日志 / Bark 显示名，可省略
    mobile: "13800138000"
    password: "your_password"
    claim: true                  # 收矿，新手建议 true
    upgrade: false               # 升级会花币，新手建议 false
    # captcha: "123456"          # 仅首次新设备绑定用，成功后删掉

  # - name: "备号"
  #   mobile: "13900139000"
  #   password: "..."
  #   claim: true
  #   upgrade: false

# 可选：Bark 标题里的全局备注
# note: "家里电脑"

# 设备指纹缓存（默认本目录 device_cache.json；青龙默认 /ql/data/fun_device_cache.json）
# device_cache: "./device_cache.json"

# base_url: "https://exchange.acmes.dev/api/v1"

notify:
  # 与仓库其它项目共用：也可用环境变量 BARK_URL / BARK_KEY
  # bark_url: "https://api.day.app/你的Key/"
  bark_key: ""
  # bark_server: "https://api.day.app"
  bark_group: "FUN矿池"
