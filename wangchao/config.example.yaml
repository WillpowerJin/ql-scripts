# 复制为 config.yaml 后填写（config.yaml 不进仓库）
# cp config.example.yaml config.yaml

accounts:
  # 推荐：手机号 + 密码（脚本自动登录并获取 account/session）
  - name: "主号"
    phone: "1xxxxxxxxxx"
    password: "你的密码"

  # 备用：抓包得到的 session（密码方式优先，两者都填时也会走密码登录）
  # - name: "备号"
  #   account_id: ""
  #   session_id: ""
  #   device_id: "1"

api:
  base_url: "https://xmt.taizhou.com.cn"
  vapp_url: "https://vapp.taizhou.com.cn"
  passport_url: "https://passport.tmuyun.com"
  timeout: 20
  # 文章之间的冷却（前端 clickCooldown=8）
  click_cooldown: 8
  jitter: 1.5
  # 海外 VPS 无代理时：用国内 DoH 解析域名（默认 true）
  doh_enable: true
  # doh_urls:
  #   - "https://dns.alidns.com/resolve"
  #   - "https://doh.pub/dns-query"
  # 仍失败时可写死 IP（在国内机器 dig 后填入）
  # hosts:
  #   xmt.taizhou.com.cn: "111.3.157.195"

lottery:
  enable: true
  base_url: "https://srv-app.taizhou.com.cn"
  activity_id: 67

# 通知（青龙更推荐用环境变量 BARK_URL / BARK_KEY，与 hifiti 共用）
notify:
  # Bark：二选一
  # 完整 URL（App 里复制），如 https://api.day.app/xxxxxxxx/
  bark_url: ""
  # 或只填 key
  bark_key: ""
  bark_server: "https://api.day.app"
  bark_group: "望潮阅读有礼"
  # bark_sound: "bell"
  # bark_icon: "https://example.com/icon.png"
  # bark_level: "active"
  # serverchan_key: ""
  # webhook_url: ""

log:
  level: "INFO"
