# 复制为 config.yaml 后填写（config.yaml 不进仓库）
# cp config.example.yaml config.yaml

accounts:
  # =====================================================================
  # ★【重点】抽奖策略（默认）
  #   1. 所有账号 → 只自动完成阅读，不自动抽奖
  #   2. 抽奖 → 请用手机流量在望潮 App 内手动完成
  #   3. 原因：抽奖站按公网 IP / 设备会话风控，「账号异常」高发
  #   覆盖：账号写 lottery: true；并设 lottery.enable: true / WANGCHAO_LOTTERY=1
  # =====================================================================

  # 推荐：手机号 + 密码（脚本自动登录并获取 account/session）
  # 阅读 deviceId：不填则按手机号稳定生成，各号互不相同
  - name: "主号"
    phone: "1xxxxxxxxxx"
    password: "你的密码"
    # device_id: ""
    # proxy: ""                 # 可选；有独立出口且要脚本抽奖时再配
    # lottery: true             # 默认 false（只阅读）；显式 true 才自动抽
    # app_unique_id: ""         # App 内抓包的「设备唯一 sessionId」，用于 loginWC

  - name: "号2"
    phone: "1yyyyyyyyyy"
    password: "你的密码2"
    # 默认只阅读；抽奖请手动：手机流量 + App

  - name: "号3"
    phone: "1zzzzzzzzzz"
    password: "你的密码3"
    # 默认只阅读，不自动抽奖

  # 备用：抓包得到的 session（密码方式优先，两者都填时也会走密码登录）
  # - name: "备号"
  #   account_id: ""
  #   session_id: ""
  #   device_id: "a1b2c3d4e5f60718"

api:
  base_url: "https://xmt.taizhou.com.cn"
  vapp_url: "https://vapp.taizhou.com.cn"
  passport_url: "https://passport.tmuyun.com"
  timeout: 20
  # 文章之间的冷却（前端 clickCooldown=8）
  click_cooldown: 8
  jitter: 1.5
  # 多账号之间间隔秒数（防 init「操作过于频繁」）
  account_interval: 20
  # init 被限流时的最大重试次数
  init_max_retries: 5
  # 启动随机抖动秒数（默认 300），避免多账号固定 cron 集中请求触发风控
  start_jitter: 300

lottery:
  # 全局总开关；默认 false（全号只阅读）
  # 若要脚本抽奖：设 true，并在对应账号写 lottery: true
  enable: false
  base_url: "https://srv-app.taizhou.com.cn"
  activity_id: 67

# 通知（青龙更推荐用环境变量 BARK_URL / BARK_KEY，与 hifiti 共用）
notify:
  # Bark：二选一
  # 完整 URL（App 里复制），如 https://api.day.app/xxxxxxxx/
  bark_url: ""
  # 或只填 key
  bark_key: ""
  bark_server: "https://api.day.app"
  bark_group: "望潮阅读有礼"
  # bark_sound: "bell"
  # bark_icon: "https://example.com/icon.png"
  # bark_level: "active"
  # serverchan_key: ""
  # webhook_url: ""

log:
  level: "INFO"
