# 酷狗概念版金币任务配置示例
# 复制为 config.yaml 后填写实际账号（config.yaml 已在 .gitignore，不要提交）

accounts:
  - name: "主号"                 # 日志/通知显示名
    token: "你的 Kugou token"    # 必填
    userid: "你的 userid"        # 必填，数字
    # 以下可选；不填会按 token 自动推导
    mid: ""                     # 设备 mid，建议从抓包中获取真实值（新版通常 40 位）
    dfid: ""                    # 设备 dfid
    devid: ""                   # KG-DEVID 设备标识
    t2: ""                      # 部分账号需要
    uni_verify_str: ""          # 部分账号需要
    # App 版本参数；默认适配 2026-11 新版概念版（3114 / 12520）
    appid: "3114"
    clientver: "12520"
    channel: "12520"

  # - name: "小号"
  #   token: "第二个 token"
  #   userid: "第二个 userid"
  #   mid: ""
  #   dfid: ""
  #   devid: ""

# 执行参数
delay: "1.2-2.5"        # 任务间隔秒（"最小-最大"）
timeout: 25             # 单次请求超时秒
retry: 1                # 请求重试次数
double_max: 12          # 翻倍链上限
double_delay: 1.5       # 翻倍间隔秒
loop_rounds: 40         # 1105 最大轮数
loop_max_wait: 1200     # 1105 单次最大等待秒
concurrent: true        # 多账号并发
max_workers: 10         # 并发账号数
lock: true              # 防重复运行锁
lock_ttl: 3600          # 无 PID 的旧锁过期秒数

# 通知配置（可选）
# 与仓库中其它脚本（kuailefeng / huazhu 等）兼容
bark:
  url: ""               # 完整 Bark URL，例如 https://api.day.app/your_key
  key: ""               # 或仅填 Bark 设备 Key
  server: "https://api.day.app"
  group: "酷狗概念版"
  sound: ""             # 提示音，例如 minuet
  icon: ""              # 自定义通知图标 URL
  level: ""             # 通知中断级别，例如 active / timeSensitive

pushplus:
  token: ""             # PushPlus 微信推送 Token
  topic: ""             # 群组编码（可选）
