# 复制为 config.yaml 后填写（不要提交 config.yaml）
# cp config.example.yaml config.yaml

accounts:
  # 浏览器登录 https://vip.1kf.com 后，F12 复制完整 Cookie（至少含 session_token）
  - name: "主号"
    cookie: "session_token=xxx; PHPSESSID=xxx"

  # ⚠️ 站点规则：一人一号，多号必封，建议只配一个账号

# 抽奖（默认关闭：积分留着兑换现金更划算，每次抽奖消耗 10 积分）
lottery: false
lottery_times: 1

# 积分兑换余额（1 元 = 20 积分，站点最低 20 起兑）
exchange: true
exchange_min: 20
exchange_all: false   # false=只兑 20 的整数倍留零头；true=全部兑光

timeout: 20
inter_account_delay: 5

notify:
  # Bark：二选一
  bark_url: ""
  bark_key: ""
  bark_server: "https://api.day.app"
  bark_group: "1KF签到"
  # bark_sound: "bell"
  # bark_icon: "https://example.com/icon.png"
  # bark_level: "active"
  # Server酱 / 自定义 Webhook
  serverchan_key: ""
  webhook_url: ""
