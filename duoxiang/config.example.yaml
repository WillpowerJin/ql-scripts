# 本地调试用配置（青龙请用环境变量，见 README）
# cp config.example.yaml config.yaml
# 勿把 config.yaml 提交到 Git

accounts:
  - name: "主号"
    phone: "13800138000"
    password: "your_password"
    # 可选：已有 Bearer token 时免登
    # token: ""

  # - name: "备号"
  #   phone: "139..."
  #   password: "..."

# 余额整元自动提现（需支付宝+实名）；也可用 DX_WITHDRAW=0 关闭
withdraw_enabled: true

timeout: 15
max_retries: 3
retry_interval: 10
inter_account_delay_min: 30
inter_account_delay_max: 60
delay_after_login_min: 5
delay_after_login_max: 10

