# B 站每日任务 · Quantumult X v1
#
# ★ 推荐：任务图库一键导入（推仓库后）
#   https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/quantumultx/gallery.json
#   QX → 任务 → 图库 → 添加上述链接 → 打开「B站每日任务」添加
#   会同时带上「B站_获取Cookie」重写
#
# 下面是手搓 rewrite / task 的备用写法。
#
# ---------- 方案 A：远程（仓库 raw）----------
[rewrite_local]
^https?:\/\/app\.bilibili\.com\/x\/(resource\/fingerprint|v2\/account\/myinfo) url script-request-header https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/bilibili/quantumultx/bilibili_cookie.js

[task_local]
30 7 * * * https://raw.githubusercontent.com/WillpowerJin/ql-scripts/main/bilibili/quantumultx/bilibili_daily.js, tag=B站每日任务, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/bilibili.png, enabled=true

[mitm]
hostname = app.bilibili.com

# ---------- 方案 B：本地脚本（推荐，避免 raw 缓存）----------
# 1) 把 bilibili_cookie.js / bilibili_daily.js 放到
#    文件 App → Quantumult X → Scripts
# 2) rewrite / task 改成文件名：
# ^https?:\/\/app\.bilibili\.com\/x\/(resource\/fingerprint|v2\/account\/myinfo) url script-request-header bilibili_cookie.js
# 30 7 * * * bilibili_daily.js, tag=B站每日任务, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/bilibili.png, enabled=true
#
# 使用步骤：
# 1) MitM 证书已信任，hostname 追加 app.bilibili.com
# 2) 重写贴上面 rewrite + mitm，右下角重载
# 3) 打开哔哩哔哩 App，应弹出「📺 B站Cookie·v1」
# 4) 定时任务会用 $prefs.bili_cookie 跑每日任务
# 5) 默认不投币（保硬币）。若要投币：任务 argument 填 coin=5
#    或 $prefs.setValueForKey("5","bili_coin_num")
