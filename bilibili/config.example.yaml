# cp config.example.yaml config.yaml 后填写（config.yaml 勿提交）

accounts:
  # 推荐：不填 cookie，先跑 get_cookie.py 扫码；daily.py 会读缓存。
  # 或从浏览器复制 SESSDATA + bili_jct（可选 DedeUserID）。
  - name: "主号"
    cookie: ""
    # 扫码成功后脚本会写入 access_token，一般不用手填
    access_token: ""
    # 账密会撞极验，不推荐
    username: ""
    password: ""

  # 多账号示例
  # - name: "号2"
  #   cookie: "SESSDATA=...; bili_jct=...; DedeUserID=..."

# 每日投币次数 0~5（0=不投币，保硬币；满额经验再改 1～5）
coin_num: 0
# 银瓜子兑硬币
silver2coin: true
# 直播中心签到（官方多已下线，默认关）
live_sign: false
# 漫画签到
manga_sign: true
# 大会员：额外经验 / 大积分浏览 / 每月福利
vip_tasks: true

# 可选：极验通过后的参数（接打码平台时填，一般不需要）
# geetest:
#   token: ""
#   challenge: ""
#   validate: ""
#   seccode: ""

timeout: 25
# user_agent: "..."

notify:
  bark_url: ""
  bark_key: ""
  bark_group: "B站每日任务"
